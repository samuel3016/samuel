services:
  - type: web
    name: cps-claude-bridge
    runtime: python
    rootDir: cps-claude-bridge
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MAKE_AVAILABILITY_WEBHOOK_URL
        sync: false
      - key: MAKE_LEAD_WEBHOOK_URL
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
